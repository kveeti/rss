name: ci

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

env:
  DOCKERHUB_USERNAME: veetik
  DOCKERHUB_IMAGE: veetik/rss
  IMAGE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  checks:
    runs-on: ubuntu-24.04-arm
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # 6.0.1
        with:
          ref: ${{ env.IMAGE_SHA }}
          persist-credentials: false
      - uses: actions-rust-lang/setup-rust-toolchain@1780873c7b576612439a134613cc4cc74ce5538c # 1.15.2
        with:
          components: rustfmt

      - name: "check formatting"
        run: cargo fmt --check


  amd64_build:
    name: build docker image (amd64)
    runs-on: ubuntu-24.04
    needs: checks
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # 6.0.1
        with:
          ref: ${{ env.IMAGE_SHA }}
          persist-credentials: false

      - name: "frontend: setup pnpm"
        uses: pnpm/action-setup@41ff72655975bd51cab0327fa583b6e92b6d3061 # 4.2.0
        with:
          package_json_file: frontend/package.json
          cache: true
          cache_dependency_path: frontend/pnpm-lock.yaml

      - name: "frontend: install deps"
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: "frontend: build"
        working-directory: frontend
        run: pnpm run build

      - name: "backend: setup rust toolchain"
        uses: actions-rust-lang/setup-rust-toolchain@1780873c7b576612439a134613cc4cc74ce5538c # 1.15.2
        with:
          target: x86_64-unknown-linux-musl
          rust-src-dir: backend

      - name: "backend: setup sccache"
        uses: mozilla-actions/sccache-action@7d986dd989559c6ecdb630a3fd2557667be217ad # 0.0.9

      - name: "backend: install musl-tools"
        uses: awalsh128/cache-apt-pkgs-action@acb598e5ddbc6f68a970c5da0688d2f3a9f04d05 # 1.6.0
        with:
          packages: musl-tools=1.2.4-2

      - name: "backend: build binary"
        run: |
          cd backend && \
          cargo build --release --target x86_64-unknown-linux-musl && \
          cp ./target/x86_64-unknown-linux-musl/release/backend ./backend && \
          chmod +x ./backend
        env:
          SCCACHE_GHA_ENABLED: "true"
          RUSTC_WRAPPER: "sccache"

      - name: "docker: setup qemu"
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # 3.7.0

      - name: "docker: setup buildx"
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # 3.12.0

      - name: "docker: build and export image"
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # 6.18.0
        with:
          context: .
          platforms: linux/amd64
          tags: rss-build:amd64
          provenance: false
          outputs: type=docker,dest=${{ runner.temp }}/rss-amd64.tar

      - name: "artifact: upload image"
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # 4.6.2
        with:
          name: rss-amd64
          path: ${{ runner.temp }}/rss-amd64.tar
          if-no-files-found: error
          retention-days: 1
          compression-level: 0


  arm64_build:
    name: build docker image (arm64)
    runs-on: ubuntu-24.04-arm
    needs: checks
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # 6.0.1
        with:
          ref: ${{ env.IMAGE_SHA }}
          persist-credentials: false

      - name: "frontend: setup pnpm"
        uses: pnpm/action-setup@41ff72655975bd51cab0327fa583b6e92b6d3061 # 4.2.0
        with:
          package_json_file: frontend/package.json
          cache: true
          cache_dependency_path: frontend/pnpm-lock.yaml

      - name: "frontend: install deps"
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: "frontend: build"
        working-directory: frontend
        run: pnpm run build

      - name: "backend: setup rust toolchain"
        uses: actions-rust-lang/setup-rust-toolchain@1780873c7b576612439a134613cc4cc74ce5538c # 1.15.2
        with:
          target: aarch64-unknown-linux-musl
          rust-src-dir: backend

      - name: "backend: setup sccache"
        uses: mozilla-actions/sccache-action@7d986dd989559c6ecdb630a3fd2557667be217ad # 0.0.9

      - name: "backend: install musl-tools"
        uses: awalsh128/cache-apt-pkgs-action@acb598e5ddbc6f68a970c5da0688d2f3a9f04d05 # 1.6.0
        with:
          packages: musl-tools=1.2.4-2 gcc-aarch64-linux-gnu

      - name: "backend: build binary"
        run: |
          cd backend && \
          cargo build --release --target aarch64-unknown-linux-musl && \
          cp ./target/aarch64-unknown-linux-musl/release/backend ./backend && \
          chmod +x ./backend
        env:
          SCCACHE_GHA_ENABLED: "true"
          RUSTC_WRAPPER: "sccache"
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_LINKER: aarch64-linux-gnu-gcc
          CC_aarch64_unknown_linux_musl: aarch64-linux-gnu-gcc

      - name: "docker: setup qemu"
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # 3.7.0

      - name: "docker: setup buildx"
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # 3.12.0

      - name: "docker: build and export image"
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # 6.18.0
        with:
          context: .
          platforms: linux/arm64
          tags: rss-build:arm64
          provenance: false
          outputs: type=docker,dest=${{ runner.temp }}/rss-arm64.tar

      - name: "artifact: upload image"
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # 4.6.2
        with:
          name: rss-arm64
          path: ${{ runner.temp }}/rss-arm64.tar
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

  publish:
    name: publish multi-arch image
    runs-on: ubuntu-24.04
    needs:
      - amd64_build
      - arm64_build
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - name: "docker: setup buildx"
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # 3.12.0

      - name: "artifact: download amd64 image"
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # 4.3.0
        with:
          name: rss-amd64
          path: ${{ runner.temp }}/images/amd64

      - name: "artifact: download arm64 image"
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # 4.3.0
        with:
          name: rss-arm64
          path: ${{ runner.temp }}/images/arm64

      - name: "docker: load images"
        run: |
          docker load --input "$RUNNER_TEMP/images/amd64/rss-amd64.tar"
          docker tag rss-build:amd64 "$DOCKERHUB_IMAGE:$IMAGE_SHA-amd64"
          docker load --input "$RUNNER_TEMP/images/arm64/rss-arm64.tar"
          docker tag rss-build:arm64 "$DOCKERHUB_IMAGE:$IMAGE_SHA-arm64"

      - name: "docker: login to dockerhub"
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # 3.7.0
        with:
          username: ${{ env.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: "docker: generate metadata"
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # 5.10.0
        id: meta
        with:
          images: ${{ env.DOCKERHUB_IMAGE }}
          tags: |
            type=raw,value=${{ github.event.pull_request.head.sha || github.sha }}
            type=sha
            type=ref,event=pr
            type=raw,value=latest,enable={{is_default_branch}}

      - name: "docker: push images and manifest"
        run: |
          docker push "$DOCKERHUB_IMAGE:$IMAGE_SHA-amd64"
          docker push "$DOCKERHUB_IMAGE:$IMAGE_SHA-arm64"
          mapfile -t tags < <(jq -r '.tags[]' <<< "$DOCKER_METADATA_OUTPUT_JSON")
          tag_args=()
          for tag in "${tags[@]}"; do
            tag_args+=(--tag "$tag")
          done
          docker buildx imagetools create "${tag_args[@]}" \
            "$DOCKERHUB_IMAGE:$IMAGE_SHA-amd64" \
            "$DOCKERHUB_IMAGE:$IMAGE_SHA-arm64"

      - name: "output: image tags"
        run: |
          {
            echo "## 🐳 Docker Image Tags"
            echo ""
            echo "\`\`\`"
            jq -r '.tags[]' <<< "$DOCKER_METADATA_OUTPUT_JSON"
            echo "\`\`\`"
          } >> "$GITHUB_STEP_SUMMARY"

  preview_link:
    name: post preview link
    runs-on: ubuntu-24.04
    needs: publish
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.user.login == 'kveeti'
    permissions:
      pull-requests: write
    steps:
      - uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # 8.0.0
        with:
          script: |
            const body = `https://rss-pr-${context.issue.number}.preview.veetik.com`;
            const comments = await github.paginate(github.rest.issues.listComments, {
              ...context.repo,
              issue_number: context.issue.number,
            });
            const comment = comments.find(comment =>
              comment.user.login === 'github-actions[bot]' &&
              comment.body?.includes(body)
            );
            if (comment) {
              await github.rest.issues.updateComment({
                ...context.repo,
                comment_id: comment.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                ...context.repo,
                issue_number: context.issue.number,
                body,
              });
            }
